    // --- SOUND ENGINE (Synthesizes gentle oceanic ambience & UI clicks via Web Audio API) ---
    class OceanicSoundEngine {
      constructor() {
        this.ctx = null;
        this.ambientGain = null;
        this.isPlaying = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleAmbience() {
        this.init();
        if (!this.ctx) return false;

        if (this.isPlaying) {
          if (this.ambientGain) {
            this.ambientGain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);
            setTimeout(() => {
              this.isPlaying = false;
            }, 1200);
          }
          this.isPlaying = false;
          return false;
        } else {
          try {
            // White/Pink noise generator for gentle ocean swell
            const bufferSize = 2 * this.ctx.sampleRate;
            const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              output[i] = (b0 + b1 + b2) * 0.11;
            }

            const whiteNoise = this.ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            // Lowpass filter for deep oceanic resonance
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(320, this.ctx.currentTime);

            // Modulate filter frequency with LFO to simulate gentle wave breathing
            const lfo = this.ctx.createOscillator();
            lfo.frequency.setValueAtTime(0.12, this.ctx.currentTime); // 8-second cycle
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.setValueAtTime(140, this.ctx.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();

            this.ambientGain = this.ctx.createGain();
            this.ambientGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
            this.ambientGain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 2.0);

            whiteNoise.connect(filter);
            filter.connect(this.ambientGain);
            this.ambientGain.connect(this.ctx.destination);
            whiteNoise.start();

            this.isPlaying = true;
            return true;
          } catch (e) {
            console.error("Audio ambience error:", e);
            return false;
          }
        }
      }

      playBubblePop() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(500 + Math.random() * 300, now);
          osc.frequency.exponentialRampToValueAtTime(1400 + Math.random() * 200, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        } catch(e) {}
      }

      playAddToCartChime() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const now = this.ctx.currentTime + idx * 0.07;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.36);
          });
        } catch(e) {}
      }
    }

    // --- BUBBLE PARTICLES CANVAS COMPONENT ---
    function UnderwaterCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Generate 65 bubbles with varying depth and behavior
        const bubbles = [];
        for (let i = 0; i < 65; i++) {
          bubbles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: 1.5 + Math.random() * 6.5,
            speedY: 0.35 + Math.random() * 0.9,
            wobbleSpeed: 0.02 + Math.random() * 0.03,
            wobbleAmp: 0.8 + Math.random() * 2.5,
            wobbleOffset: Math.random() * Math.PI * 2,
            opacity: 0.15 + Math.random() * 0.45,
            highlightOpacity: 0.4 + Math.random() * 0.5
          });
        }

        // Mouse hover interaction
        let mouseX = -1000;
        let mouseY = -1000;
        const handleMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const handleCanvasClick = (e) => {
          soundEngine.playBubblePop();
          // Spawn a burst of 6 tiny micro-bubbles on click
          for (let k = 0; k < 6; k++) {
            bubbles.push({
              x: e.clientX + (Math.random() - 0.5) * 20,
              y: e.clientY + (Math.random() - 0.5) * 20,
              radius: 1 + Math.random() * 3,
              speedY: 1.2 + Math.random() * 1.5,
              wobbleSpeed: 0.05,
              wobbleAmp: 1.5,
              wobbleOffset: Math.random() * 6,
              opacity: 0.7,
              highlightOpacity: 0.9
            });
          }
          if (bubbles.length > 80) bubbles.splice(0, bubbles.length - 80);
        };
        canvas.addEventListener('click', handleCanvasClick);

        let t = 0;
        const render = () => {
          t += 0.02;
          ctx.clearRect(0, 0, width, height);

          bubbles.forEach((b) => {
            b.y -= b.speedY;
            b.wobbleOffset += b.wobbleSpeed;
            const currentX = b.x + Math.sin(b.wobbleOffset) * b.wobbleAmp;

            // Repel slightly if mouse is nearby
            const dx = currentX - mouseX;
            const dy = b.y - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 80) {
              const force = (80 - dist) / 80;
              b.x += (dx / dist) * force * 2;
              b.y -= force * 1.5;
            }

            // Recycle bubble when it hits the surface
            if (b.y < -15) {
              b.y = height + 10;
              b.x = Math.random() * width;
            }

            // Draw 3D Translucent Water Bubble
            ctx.save();
            ctx.beginPath();
            ctx.arc(currentX, b.y, b.radius, 0, Math.PI * 2);

            // Outer bubble glow/sheen
            const grad = ctx.createRadialGradient(
              currentX - b.radius * 0.3,
              b.y - b.radius * 0.3,
              b.radius * 0.1,
              currentX,
              b.y,
              b.radius
            );
            grad.addColorStop(0, `rgba(224, 242, 254, ${b.opacity * 0.9})`);
            grad.addColorStop(0.6, `rgba(56, 189, 248, ${b.opacity * 0.4})`);
            grad.addColorStop(0.9, `rgba(2, 132, 199, ${b.opacity * 0.2})`);
            grad.addColorStop(1, `rgba(0, 210, 255, ${b.opacity * 0.8})`);

            ctx.fillStyle = grad;
            ctx.fill();

            // Bubble border ring
            ctx.strokeStyle = `rgba(186, 230, 253, ${b.opacity * 0.7})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();

            // Specular Reflection Highlight Dot (Gives glass/water realism)
            ctx.beginPath();
            ctx.arc(
              currentX - b.radius * 0.35,
              b.y - b.radius * 0.35,
              Math.max(0.6, b.radius * 0.22),
              0,
              Math.PI * 2
            );
            ctx.fillStyle = `rgba(255, 255, 255, ${b.highlightOpacity})`;
            ctx.fill();

            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          canvas.removeEventListener('click', handleCanvasClick);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-auto z-10 opacity-70"
          style={{ mixBlendMode: 'screen' }}
        />
      );
    }

                          <input type="radio" name="payment" className="accent-cyan-400" />
                          <div>
                            <div className="font-bold text-white text-sm">Cash on Delivery (COD)</div>
                            <div className="text-[11px] text-slate-400">Pay cash/UPI at doorstep upon delivery</div>
                          </div>
                        </div>
                        <span className="text-xs font-mono font-bold text-emerald-400">Active</span>
                      </label>
                    </div>

                    <div className="pt-4 flex gap-3">
                      <button onClick={() => setCheckoutStep(1)} className="px-5 py-3 rounded-xl border border-slate-700 text-slate-300 font-bold text-xs uppercase">
                        Back
                      </button>
                      <button
                        onClick={() => {
                          setCheckoutStep(3);
                          setCart([]);
                        }}
                        className="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black text-xs uppercase tracking-wider"
                      >
                        Place Order (₹{cartGrandTotal})
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 3: ORDER CONFIRMED CELEBRATION */}
                {checkoutStep === 3 && (
                  <div className="text-center py-6 space-y-4">
                    <div className="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-400 text-emerald-400 text-3xl flex items-center justify-center mx-auto animate-bounce">
                      ✓
                    </div>
                    <span className="text-xs font-mono uppercase tracking-widest text-emerald-400 font-bold">Order Confirmed</span>
                    <h3 className="font-serif text-3xl font-bold text-white">THANK YOU FOR YOUR PATRONAGE</h3>
                    <p className="text-xs text-slate-300 max-w-md mx-auto">
                      Your order has been recorded. Order ID: <strong className="text-cyan-300 font-mono">#WS-HYDRA-84920</strong>. A confirmation SMS & email have been dispatched.
                    </p>

                    <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs text-left max-w-sm mx-auto space-y-1.5">
                      <div className="flex justify-between text-slate-400"><span>Estimated Delivery:</span> <strong className="text-white">2 - 3 Days</strong></div>
                      <div className="flex justify-between text-slate-400"><span>Courier Partner:</span> <strong className="text-cyan-300">BlueDart Air</strong></div>
                      <div className="flex justify-between text-slate-400"><span>Status:</span> <strong className="text-emerald-400">Processing in Warehouse</strong></div>
                    </div>

                    <button
                      onClick={() => setIsCheckoutOpen(false)}
                      className="px-8 py-3 rounded-xl bg-cyan-500 text-black font-bold text-xs uppercase"
                    >
                      Continue Shopping
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 5: LIVE SEARCH MODAL (Ctrl + K)
             ================================================================= */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsSearchOpen(false)}></div>

              <div className="relative z-10 w-full max-w-2xl rounded-3xl glass-panel border border-cyan-400/40 p-6 bg-[#040e24] shadow-2xl">
                <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                  <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  <input
                    autoFocus
                    type="text"
                    placeholder="Search fragrance by name (e.g. Hydra Energy, Edge) or note (Bergamot, Amber)..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="flex-1 bg-transparent text-sm text-white focus:outline-none placeholder-slate-500"
                  />
                  <button onClick={() => setIsSearchOpen(false)} className="text-xs text-slate-500 hover:text-white">ESC</button>
                </div>

                <div className="py-4 max-h-72 overflow-y-auto space-y-2">
                  {filteredProducts.length === 0 ? (
                    <div className="text-center py-8 text-xs text-slate-400">No fragrances matched your search query.</div>
                  ) : (
                    filteredProducts.map(p => (
                      <div
                        key={p.id}
                        onClick={() => {
                          setQuickViewProduct(p);
                          setIsSearchOpen(false);
                        }}
                        className="p-3 rounded-xl glass-panel border border-slate-800/80 hover:border-cyan-400/40 flex items-center justify-between cursor-pointer transition"
                      >
                        <div className="flex items-center gap-3">
                          <img src={p.image} alt={p.name} className="w-12 h-12 object-contain rounded bg-slate-900" />
                          <div>
                            <div className="font-bold text-white text-sm">{p.name}</div>
                            <div className="text-xs text-slate-400">{p.family}</div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="font-bold text-cyan-300 text-sm">₹{p.price}</div>
                          <div className="text-[10px] text-amber-300">★ {p.rating}</div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 6: WRITE A REVIEW MODAL
             ================================================================= */}
          {isWriteReviewOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsWriteReviewOpen(false)}></div>

              <div className="relative z-10 w-full max-w-lg rounded-3xl glass-panel border border-cyan-400/40 p-6 sm:p-8 bg-[#040e24] shadow-2xl">
                <button onClick={() => setIsWriteReviewOpen(false)} className="absolute top-6 right-6 text-slate-400 hover:text-white">✕</button>

                <h3 className="font-serif text-2xl font-bold text-white mb-2">Write a Review</h3>
                <p className="text-xs text-slate-400 mb-6">Share your olfactory experience with other fragrance enthusiasts.</p>

                <form onSubmit={handleReviewSubmit} className="space-y-4">
                  {/* Star Rating Picker */}
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-2 uppercase">Your Rating</label>
                    <div className="flex gap-2">
                      {[1, 2, 3, 4, 5].map(star => (
                        <button
                          key={star}
                          type="button"
                          onClick={() => setNewReviewForm({ ...newReviewForm, rating: star })}
                          className={`text-2xl transition ${star <= newReviewForm.rating ? 'text-amber-400 scale-110' : 'text-slate-600'}`}
                        >
                          ★
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1 uppercase">Your Name</label>
                      <input
                        required
                        type="text"
                        placeholder="e.g. Aryan Malhotra"
                        value={newReviewForm.name}
                        onChange={(e) => setNewReviewForm({ ...newReviewForm, name: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1 uppercase">City</label>
                      <input
                        type="text"
                        placeholder="e.g. Pune"
                        value={newReviewForm.city}
                        onChange={(e) => setNewReviewForm({ ...newReviewForm, city: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1 uppercase">Review Title</label>
                    <input
                      required
                      type="text"
                      placeholder="e.g. Beast projection, clean aquatic dry-down!"
                      value={newReviewForm.title}
                      onChange={(e) => setNewReviewForm({ ...newReviewForm, title: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1 uppercase">Your Review</label>
                    <textarea
                      required
                      rows="3"
                      placeholder="Describe the scent evolution, projection and compliments received..."
                      value={newReviewForm.content}
                      onChange={(e) => setNewReviewForm({ ...newReviewForm, content: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black text-xs uppercase tracking-wider"
                  >
                    Submit Verified Review
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
